server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|json)$ {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store";
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|webmanifest)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }
}
